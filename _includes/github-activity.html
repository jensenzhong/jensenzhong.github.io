<section class="github-activity github-activity--compact" aria-labelledby="github-activity-title">
  <header class="github-activity__header">
    <h2 class="github-activity__title" id="github-activity-title"><a href="https://github.com/{{ site.author.github }}">{% if page.lang == 'zh-CN' %}GitHub 动态{% else %}GitHub Activity{% endif %}</a></h2>
  </header>
  <div class="github-activity__chart">
    <a href="https://github.com/{{ site.author.github }}"><img src="{{ '/images/github-contributions.svg' | relative_url }}?v={{ site.data.github-activity.updated_at | date: '%s' }}" alt="{{ site.author.github }} GitHub contributions, {{ site.data.github-activity.start }} – {{ site.data.github-activity.end }}" width="447" height="104"></a>
  </div>
  <p class="github-activity__updated">{% if page.lang == 'zh-CN' %}更新于{% else %}Updated{% endif %} <time datetime="{{ site.data.github-activity.updated_at }}">{{ site.data.github-activity.updated_date }}</time></p>
</section>
