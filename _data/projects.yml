- id: literature-analysis
  detail_url: /literature-fire-portfolio/index.html
  zh:
    title: 智能建造与建筑消防文献交互分析
    meta: 2026 年 4 月 — 6 月 · 智能建造课程作品
    background: 围绕智能建造技术在建筑消防中的应用，将分散的文献关系、应用场景与技术演化整理为便于探索的交互式研究展示。
    contributions:
    - label: 文献梳理与知识组织
      text: 围绕 CNKI 文献互引、应用场景聚类及技术演化，整理研究之间的关联与变化脉络。
    - label: 交互图谱与数据可视化
      text: 将文献关系转化为网络图与演化图，支持从图形界面探索研究主题和场景联系。
    - label: 研究成果网页化
      text: 整合图谱预览、独立交互页面与汇报材料，形成可浏览、可操作的成果展示。
    outcome: 完成**4 组交互图谱**，覆盖文献互引、应用场景聚类、应用场景演化与国内技术演化。
  en:
    title: Interactive Literature Analysis for Smart Construction and Fire Safety
    meta: Apr. – Jun. 2026 · Smart-construction coursework
    background: The project organizes literature relationships, application scenarios, and technology evolution
      in smart construction and building fire safety into an explorable research presentation.
    contributions:
    - label: Literature synthesis
      text: Organized CNKI citation relationships, application clusters, and technology evolution to reveal connections
        across studies.
    - label: Interactive data visualization
      text: Presented literature relationships as network and evolution diagrams for visual exploration.
    - label: Web-based research communication
      text: Integrated diagram previews, interactive pages, and presentation materials into a browsable project
        site.
    outcome: Delivered **four interactive visualizations** covering citation networks, application clusters, application
      evolution, and domestic technology evolution.
